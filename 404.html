<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Página no encontrada</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'IBM Plex Mono',Menlo,Consolas,monospace;
    background:#0f1117;color:#e2e8f0;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .box{
    max-width:520px;text-align:center;padding:44px 36px;
    border:1px solid rgba(255,255,255,0.15);border-radius:16px;
    background:#181c27;box-shadow:0 20px 60px rgba(0,0,0,0.6);
  }
  .icon{font-size:64px;margin-bottom:16px}
  h1{font-size:26px;font-weight:600;margin-bottom:8px;letter-spacing:1px}
  p{font-size:13px;color:#94a3b8;line-height:1.7;margin-bottom:24px}
  a{
    display:inline-block;padding:12px 36px;background:#3b82f6;color:#fff;
    text-decoration:none;border-radius:8px;font-weight:600;font-size:14px;
    transition:background .25s;
  }
  a:hover{background:#60a5fa}
</style>
</head>
<body>
  <div class="box">
    <div class="icon">🚧</div>
    <h1>404</h1>
    <p>La página que buscas no existe o fue movida.<br>
       Verifica la URL o regresa al inicio.</p>
    <a href="/">← Volver al inicio</a>
  </div>
</body>
</html>
